# Mantém o projeto Supabase (plano grátis) ativo, evitando a pausa por 7 dias sem uso.
# © Arthur Ramon da Silva — Todos os direitos reservados.
name: Manter banco ativo
on:
  schedule:
    - cron: '17 12 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consultar Supabase
        run: |
          URL=$(grep -oP "SUPABASE_URL = '\K[^']+" js/config.js)
          KEY=$(grep -oP "SUPABASE_ANON_KEY = '\K[^']+" js/config.js)
          if [[ "$URL" == COLE_AQUI* ]]; then echo "Supabase ainda não configurado."; exit 0; fi
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" "$URL/rest/v1/ministerios?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
